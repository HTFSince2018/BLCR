experiment:
  name: gym_classic_control
  algo: relo_floor
  env_name: acrobot_v1
  seed: 0
  logdir: logs_gym_classic_control

env:
  type: gym
  id: Acrobot-v1
  obs_scale: 1.0
  kwargs: {}

system:
  device: auto

training:
  # Safety cap. The queue script also sets task-specific max_episodes to match
  # the Neurocomputing 2025 Gym protocol.
  num_frames: 250000
  max_episodes: 500
  batch_size: 64
  replay_capacity: 10000
  replay_start_size: 1000
  gamma: 0.99
  learning_rate: 0.001
  rmsprop_alpha: 0.95
  rmsprop_eps: 0.01
  target_update_freq: 200
  target_tau: 1.0
  train_freq: 1
  eps_start: 1.0
  eps_end: 0.1
  eps_decay_frames: 5000
  hidden_dim: 50
  hidden_layers: 2
  max_grad_norm: 10.0
  reward_clip: 0.0
  max_episode_steps: 0
  console_log_every: 25

prioritization:
  alpha: 0.6
  beta0: 0.4
  eps: 1.0e-5
  max_priority: 10.0

fluid:
  das_gamma: 1.0
  das_decay: 0.0
  density_k: 8
  density_sigma: 1.0
  density_sample_size: 64
  prune_candidates: 64

relo_improve:
  ema_decay: 0.99
  floor_weight: 0.35
  loss_weight: 0.08
  max_loss_factor: 1.25
  priority_min: 1.0e-5

logging:
  log_every: 1000
